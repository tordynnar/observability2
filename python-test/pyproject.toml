[project]
name = "observability2-test"
version = "0.1.0"
requires-python = ">= 3.11"
dependencies = [
    "grpcio>=1.68.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-grpc>=0.50b0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.68.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
